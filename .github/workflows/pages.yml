name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - run: npm test -- --watch=false

      - name: Prepare SPA fallback
        run: |
          cp dist/admin-mesh/browser/index.html dist/admin-mesh/browser/404.html
          touch dist/admin-mesh/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/admin-mesh/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
