<mat-form-field appearance="outline">
  <mat-label>{{ field().label }}</mat-label>
  <input
    matInput
    readonly
    cdkOverlayOrigin
    #referenceOrigin="cdkOverlayOrigin"
    [class.reference-preview-value]="hasPreview()"
    [value]="displayValue() ?? ''"
    [attr.aria-label]="field().label"
    (mousemove)="onDisplayMouseMove($event)"
    (mouseleave)="previewLeave()"
    (focusin)="openPreview()"
    (focusout)="previewLeave()"
  />
  <span matSuffix class="reference-actions">
    <button mat-button type="button" (click)="openLookup()">Choose</button>
    @if (hasValue() && !field().required) {
      <button mat-icon-button type="button" aria-label="Clear selected value" (click)="clear()">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    }
  </span>
  @if (requiredError()) {
    <mat-error>This field is required.</mat-error>
  }
</mat-form-field>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="referenceOrigin"
  [cdkConnectedOverlayOpen]="previewOpen()"
  [cdkConnectedOverlayPositions]="previewPositions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayFlexibleDimensions]="true"
>
  <div (mouseenter)="previewEnter()" (mouseleave)="previewLeave()">
    @if (selectedId() !== null && hasPreview()) {
      <app-reference-preview-overlay
        [resource]="previewResource()"
        [formId]="previewForm()"
        [id]="selectedId()!"
        (closed)="closePreview()"
      />
    }
  </div>
</ng-template>
