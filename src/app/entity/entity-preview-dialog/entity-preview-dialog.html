<app-entity-dialog-header
  [title]="title()"
  [icon]="data.icon"
  [iconSet]="data.iconSet ?? 'material-icons'"
  [iconColor]="data.iconColor"
  (closed)="close()"
/>
<mat-dialog-content>
  <app-entity-preview [resource]="data.resource" [formId]="data.formId" [id]="data.id" />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button type="button" (click)="close()">Close</button>
</mat-dialog-actions>
