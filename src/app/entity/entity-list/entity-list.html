@if (state(); as state) {
  @switch (state.status) {
    @case ('loading') {
      <div class="initial-loading-state" role="status" aria-live="polite">
        <mat-progress-spinner mode="indeterminate" diameter="40" aria-label="Loading" />
        <span>Loading</span>
      </div>
    }
    @case ('loaded') {
      @if (formMode(); as mode) {
        @if (formId(); as selectedFormId) {
          <app-entity-form
            [resource]="state.resource"
            [formId]="selectedFormId"
            [mode]="mode"
            [id]="formEntityId()"
            (saved)="onFormSaved($event)"
            (cancelled)="closeForm()"
          />
        } @else {
          <app-error-state message="No form is configured for this entity." />
        }
      } @else if (filterMode()) {
        <app-filter-editor
          [data]="filterEditorData()"
          (applied)="applyFilters($event)"
          (cancelled)="cancelFilterEdit()"
        />
      } @else {
        <app-entity-list-content
          [data]="state"
          [isLoading]="isListLoading()"
          [deletionError]="deletionError()"
          [locateMessage]="locateMessage()"
          [highlightedId]="highlightedEntityId()"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event, state)"
          (openFilters)="openFilters(state)"
          (clearFilters)="clearFilters()"
          (findSavedRecord)="findSavedRecord()"
          (dismissLocateMessage)="dismissLocateMessage()"
          (gridElement)="onGridElement($event)"
        />
      }
    }
    @case ('error') {
      <app-error-state [message]="state.message" />
    }
  }
}
