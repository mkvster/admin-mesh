<mat-form-field appearance="outline">
  <mat-label>Value</mat-label>
  <mat-select
    [value]="value()"
    (selectionChange)="onChange($event.value)"
    aria-label="Boolean value"
  >
    <mat-option [value]="true">Yes</mat-option>
    <mat-option [value]="false">No</mat-option>
  </mat-select>
</mat-form-field>
