<div class="grid-layout">
  <table mat-table [dataSource]="rows()">

    <colgroup>
      @for (column of metadata().columns; track column.field) {
        <col [style.width.px]="column.sizeType === 'width' ? column.size : null">
      }
    </colgroup>

    @for (item of columns(); track item.column.field) {
      <ng-container [matColumnDef]="item.column.field">

        <th
          mat-header-cell
          *matHeaderCellDef
          [matTooltip]="filterSummary(item.column.field)"
          [matTooltipDisabled]="filtersFor(item.column.field).length === 0">
          @if (filtersFor(item.column.field).length) {
            <mat-icon
              class="filter-indicator"
              aria-hidden="true">
              filter_alt
            </mat-icon>
          }
          @if (item.column.disableSorting) {
            {{ fieldLabel(item.column.field) }}
          } @else {
            <button
              type="button"
              class="sort-button"
              [attr.aria-label]="sortLabel(item.column.field)"
              (click)="onSort(item.column.field, $event)">
              <span>{{ fieldLabel(item.column.field) }}</span>
              @if (sortFor(item.column.field); as sortItem) {
                <span class="sort-indicator" aria-hidden="true">
                  {{ sortItem.direction === 'asc' ? '↑' : '↓' }}
                  <span class="sort-priority">{{ sortPriority(item.column.field) }}</span>
                </span>
              }
            </button>
          }
        </th>

        <td mat-cell *matCellDef="let row">
        @if (item.field) {
          <app-list-grid-cell
            [field]="item.field"
            [column]="item.column"
            [row]="row"
            [value]="row[item.column.field]"
          />
        }
        </td>

      </ng-container>
    }

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns(); sticky: true">
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns()">
    </tr>

  </table>
</div>

<div class="grid-footer">
  <div class="grid-actions">
    <ng-content select="[list-grid-actions]" />
  </div>

  <mat-paginator
    [length]="totalCount()"
    [pageIndex]="page() - 1"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 25, 50, 100]"
    (page)="onPageChange($event)"
    aria-label="Select list page"
  />
</div>
