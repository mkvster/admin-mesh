<mat-toolbar>
  <a class="brand" [routerLink]="['/']" (click)="navigateHome.emit()">AdminMesh</a>
  <mat-divider vertical class="toolbar-divider"></mat-divider>
  <app-breadcrumbs [items]="breadcrumbs()"></app-breadcrumbs>
  <span class="toolbar-spacer"></span>

  @if (actions(); as actions) {
    @if (actions.filterEditing) {
      <button
        mat-icon-button
        type="button"
        class="toolbar-action add-filter-action"
        aria-label="Add filter"
        matTooltip="Add filter"
        (click)="actions.addFilter?.()"
      >
        <mat-icon aria-hidden="true">add</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        class="toolbar-action clear-filter-action"
        aria-label="Clear filters"
        matTooltip="Clear filters"
        (click)="actions.clearFilters()"
      >
        <mat-icon aria-hidden="true">filter_alt_off</mat-icon>
      </button>
    } @else {
      @if (actions.canAdd) {
        <button
          mat-icon-button
          type="button"
          class="toolbar-action add-action"
          [attr.aria-label]="actions.addLabel"
          [matTooltip]="actions.addLabel"
          (click)="actions.add()"
        >
          <mat-icon aria-hidden="true">add</mat-icon>
        </button>
      }
      <button
        mat-icon-button
        type="button"
        class="toolbar-action filter-action"
        [attr.aria-label]="
          actions.filterCount ? 'Filter, ' + actions.filterCount + ' active' : 'Filter'
        "
        matTooltip="Filter"
        (click)="actions.editFilters()"
      >
        <mat-icon
          [fontSet]="actions.filterCount > 0 ? 'material-icons' : 'material-icons-outlined'"
          aria-hidden="true"
          >filter_alt</mat-icon
        >
      </button>
    }
  }

  <button
    mat-icon-button
    type="button"
    class="theme-toggle desktop-theme-toggle"
    (click)="themeState.toggle()"
    [attr.aria-label]="themeState.isDark() ? 'Light theme' : 'Dark theme'"
    [matTooltip]="themeState.isDark() ? 'Light theme' : 'Dark theme'"
  >
    <mat-icon>{{ themeState.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>
